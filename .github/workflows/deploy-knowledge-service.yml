name: Deploy knowledge-service

on:
  workflow_run:
    workflows: ["CI \u2013 Build & Test"]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag override (optional). Defaults to sha-<short-sha>."
        required: false
        type: string
  push:
    tags:
      - "knowledge-v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-knowledge-service
  cancel-in-progress: false

env:
  PROJECT_ID:        ${{ vars.GCP_PROJECT_ID }}
  REGION:            ${{ vars.GCP_REGION }}
  ARTIFACT_REPO:     ${{ vars.ARTIFACT_REPO }}
  IMAGE_NAME:        knowledge-service
  SERVICE_NAME:      knowledge-service
  WIF_PROVIDER:      ${{ vars.WIF_PROVIDER }}
  DEPLOYER_SA_EMAIL: ${{ vars.DEPLOYER_SA_EMAIL }}
  RUNTIME_SA_EMAIL:  ${{ vars.AGENT_RUNTIME_SA_EMAIL }}
  DEPLOY_SHA:        ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  deploy:
    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout CI-approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build knowledge service
        run: mvn -B -ntp -DskipTests package -pl knowledge-service -am

      - name: Compute immutable image tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/knowledge-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-$(echo "${DEPLOY_SHA}" | cut -c1-7)"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPO}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}"
          docker build -f knowledge-service/Dockerfile -t "${IMAGE}" .
          docker push "${IMAGE}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${SERVICE_NAME}" \
            --image="${IMAGE}" \
            --region="${REGION}" \
            --project="${PROJECT_ID}" \
            --service-account="${RUNTIME_SA_EMAIL}" \
            --allow-unauthenticated \
            --port=8092 \
            --min-instances=0 \
            --max-instances=1 \
            --concurrency=80 \
            --memory=512Mi \
            --cpu=1 \
            --cpu-throttling \
            --cpu-boost \
            --timeout=60 \
            --set-env-vars="^|^SPRING_PROFILES_ACTIVE=prod|PORTFOLIO_PUBLIC_BASE_URL=${{ vars.PORTFOLIO_BASE_URL || 'https://www.yuqi.site' }}" \
            --update-secrets="GEMINI_API_KEY=GEMINI_API_KEY:latest,OPENSEARCH_PASSWORD=OPENSEARCH_PASSWORD:latest"

      - name: Verify ready revision and health
        run: |
          URL="$(gcloud run services describe "${SERVICE_NAME}" \
            --region="${REGION}" --project="${PROJECT_ID}" \
            --format='value(status.url)')"
          for attempt in $(seq 1 30); do
            LATEST_READY="$(gcloud run services describe "${SERVICE_NAME}" \
              --region="${REGION}" --project="${PROJECT_ID}" \
              --format='value(status.latestReadyRevisionName)')"
            LATEST_CREATED="$(gcloud run services describe "${SERVICE_NAME}" \
              --region="${REGION}" --project="${PROJECT_ID}" \
              --format='value(status.latestCreatedRevisionName)')"
            if [ -n "${LATEST_READY}" ] && [ "${LATEST_READY}" = "${LATEST_CREATED}" ] &&
              curl --fail --silent --show-error --max-time 30 "${URL}/actuator/health" |
                grep -q '"status":"UP"'; then
              echo "Deployment verified: ${LATEST_READY}"
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for a healthy revision."
            sleep 5
          done
          echo "Knowledge service failed its deployment health gate."
          exit 1
