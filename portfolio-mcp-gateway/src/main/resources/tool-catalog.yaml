    description: List alert rules with optional filters by name, event type, or enabled status.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: name,      type: string,  required: false, description: "Name substring filter." }
      - { name: eventType, type: string,  required: false, description: "Event type filter (e.g. page_view, click)." }
      - { name: enabled,   type: boolean, required: false, description: "Filter by enabled/disabled." }
    endpoint:
      target: alerts
      method: GET
      path: /api/alert-rules

  - name: alerts.get_rule
    mode: READ
    description: Get full details of a single alert rule including version and all fields.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: ruleId, type: integer, required: true, description: "Alert rule ID." }
    endpoint:
      target: alerts
      method: GET
      path: /api/alert-rules/{ruleId}

  - name: alerts.list_incidents
    mode: READ
    description: >
      List recent visitor alert incidents and delivery state. Supports bounded filters
      by site, rule, notification state, and lookback window so an administrator can
      verify whether a rule fired and whether its notification was delivered.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: hours,    type: integer, required: false, description: "Lookback in hours; the service clamps this to 1..2160." }
      - { name: siteId,   type: string,  required: false, description: "Optional site identifier." }
      - { name: ruleId,   type: integer, required: false, description: "Optional alert rule ID." }
      - { name: notified, type: boolean, required: false, description: "Filter by notification delivery state." }
      - { name: limit,    type: integer, required: false, description: "Maximum incidents; the service clamps this to 1..200." }
    endpoint:
      target: alerts
      method: GET
      path: /api/incidents

  # ── Alerts: write (prepare/apply two-phase) ────────────────────────────
  - name: alerts.prepare_change
    mode: WRITE
    description: >
      Validate a proposed alert rule change and persist a temporary diff preview without modifying
      any rule. Returns a changeId, before/after state, diff, warnings, and expiry.
      Supported actions: CREATE, UPDATE, SET_ENABLED. CREATE requires siteId, name,
      eventType, geoLevel, granularity, threshold, comparator, and cooldownSeconds in patch.
      Optional nested filters.bot: ALL (default), EXCLUDE (only is_bot=false), ONLY (is_bot=true).
      EXCLUDE omits unclassified records too; it is not proof of a human visitor.
      Use UPDATE with only filters to preserve the other settings of an existing rule.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: action,  type: string,  required: true,  description: "CREATE | UPDATE | SET_ENABLED" }
      - { name: ruleId,  type: integer, required: false, description: "Required for UPDATE and SET_ENABLED." }
      - { name: patch,   type: object,  required: true,  description: 'Partial fields to change; for example {"filters":{"bot":"EXCLUDE"}}. Omitted filters preserve the existing policy. filters.bot accepts ALL, EXCLUDE, ONLY.' }
      - { name: reason,  type: string,  required: true, description: "Human-readable reason for the change." }
    endpoint:
      target: alerts
      method: POST
      path: /api/alert-rules/changes/prepare

  - name: alerts.apply_change
    mode: WRITE
    description: >
      Apply a previously prepared change. Only accepts the changeId returned by
      alerts.prepare_change. The change must not be expired and is single-use.
      Requires an idempotency key to prevent double-execution.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: changeId,       type: string, required: true,  description: "Change token from prepare_change." }
      - { name: idempotencyKey, type: string, required: true, description: "Unique key to prevent duplicate applies; injected by the agent runtime." }
    endpoint:
      target: alerts
      method: POST
      path: /api/alert-rules/changes/apply

