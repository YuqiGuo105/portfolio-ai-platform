      target: admin
      method: POST
      path: /api/admin/resume/revisions/{id}/rollback

  - name: resume.delete_draft
    mode: WRITE
    description: Soft-delete a draft public CV revision by archiving it. Published revisions cannot be deleted.
    requiredRole: ADMIN
    riskLevel: CRITICAL
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true }
    endpoint:
      target: admin
      method: DELETE
      path: /api/admin/resume/revisions/{id}

  # ── Admin: read ─────────────────────────────────────────────────────────
  - name: admin.search_content
    mode: READ
    description: Search or list portfolio content (blogs, projects, life blogs, experience). Omit keyword to list the selected sourceType within the result limit.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: keyword,    type: string,  required: false, description: "Optional free-text keyword; omit for a bounded listing." }
      - { name: sourceType, type: string,  required: false, description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: category,   type: string,  required: false, description: "Category slug filter." }
      - { name: limit,      type: integer, required: false, description: "Default 10, max 50." }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/content

  - name: admin.get_content
    mode: READ
    description: Fetch a single content item by sourceType + sourceId.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: sourceType, type: string,  required: true,  description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
