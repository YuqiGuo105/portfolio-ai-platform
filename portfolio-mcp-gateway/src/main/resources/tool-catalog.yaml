# Sprint 1 MCP tool catalog.
#
# IMPORTANT: tool names here MUST match site.yuqi.agent.intent.ToolRegistry
# in portfolio-agent-service exactly. The agent calls
#   POST /api/tools/{name}/invoke
# and {name} comes from its own allowlist.
#
# Each entry declares:
#   name              – stable string; agent.intent.ToolDefinition.name
#   mode              – READ | WRITE   (gateway uses this for audit + idempotency)
#   description       – short human-readable summary
#   requiredRole      – VIEWER | EDITOR | PUBLISHER | ADMIN
#   riskLevel         – LOW | MEDIUM | HIGH | CRITICAL  (gateway taxonomy)
#   dryRunSupported   – boolean
#   confirmRequired   – boolean (writes must pass _confirmed=true)
#   confirmationMethod– optional, e.g. "email_otp"
#   parameters        – list of { name, type, required, description }
#   endpoint          – { target, method, path }
#                       target ∈ portfolio | admin | notification
#
# Hard invariants enforced by the gateway:
#   * NEVER writes Supabase tables directly.
#   * NEVER constructs Kafka payloads — admin-service owns event emission for
#     publish / reindex / retry tools.
#   * Every WRITE-mode tool is audited via AuditService and respects the
#     riskLevel / confirmRequired flags.

tools:

  # ── Career application copilot (owner-only admin MCP) ─────────────────
  - name: career.get_candidate_profile
    mode: READ
    description: Get the current candidate profile snapshot assembled from first-party portfolio content through the MCP cluster.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/candidate-profile

  - name: career.refresh_candidate_profile
    mode: WRITE
    description: Refresh the Valkey candidate profile snapshot from current portfolio experience and project content.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters: []
    endpoint:
      target: career
      method: POST
      path: /internal/v1/candidate-profile/refresh

  - name: career.resolve_application_fields
    mode: READ
    description: Resolve job application fields from the cached MCP profile and private application memory; sensitive answers are returned for review, never guessed.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true }
      - { name: fields, type: array, required: true, description: "Detected form fields with id, label, type, and optional choices." }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/application-fields/resolve

  - name: career.update_private_answers
    mode: WRITE
    description: Update encrypted owner-only answers used for recurring job application questions.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: answers, type: object, required: true, description: "Normalized question-to-answer updates; null removes an answer." }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/candidate-profile/private-answers

  - name: career.get_site_credential
    mode: READ
    description: Load the encrypted owner-only account credential for one HTTPS application origin.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: origin, type: string, required: true, description: "Exact HTTPS origin of the current ATS sign-in page." }
    endpoint:
      target: career
      method: GET
      path: /internal/v1/site-credentials

  - name: career.prepare_site_credential
    mode: WRITE
    description: Create or reuse a unique encrypted credential for one ATS origin before an owner-reviewed sign-up.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: origin, type: string, required: true, description: "Exact HTTPS origin of the current ATS sign-up page." }
      - { name: username, type: string, required: true, description: "Owner-reviewed account email or username." }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/site-credentials/prepare

  # ── Admin: read ─────────────────────────────────────────────────────────
  - name: admin.search_content
    mode: READ
    description: Search portfolio content (blogs, projects, life blogs, experience).
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: keyword,    type: string,  required: true,  description: "Free-text keyword." }
      - { name: sourceType, type: string,  required: false, description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: category,   type: string,  required: false, description: "Category slug filter." }
      - { name: limit,      type: integer, required: false, description: "Default 10, max 50." }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/content

  - name: admin.get_content
    mode: READ
    description: Fetch a single content item by sourceType + sourceId.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: sourceType, type: string,  required: true,  description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: sourceId,   type: string,  required: true,  description: "Content UUID or legacy numeric id." }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/content/{sourceType}/{sourceId}

  - name: admin.list_indexing_jobs
    mode: READ
    description: List indexing jobs (RAG / OpenSearch) with optional status filter.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: status, type: string,  required: false, description: "PENDING | RUNNING | FAILED | SUCCEEDED." }
      - { name: kind,   type: string,  required: false, description: "RAG | SEARCH." }
      - { name: limit,  type: integer, required: false }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/indexing-jobs

  - name: admin.list_outbox_events
    mode: READ
    description: List recent outbox events awaiting or after Kafka emission.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: status, type: string,  required: false, description: "PENDING | SENT | FAILED." }
      - { name: limit,  type: integer, required: false }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/outbox-events

  - name: admin.get_operation_timeline
    mode: READ
    description: Trace one publication or platform operation across services using a run, event, content, session, correlation, trace, or idempotency identifier.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    note: |
      This is the Operations Timeline / OpenSearch verification tool. Use the
      sourceId, eventId, correlationId, traceId, or idempotencyKey returned by
      a write tool. Results are eventually consistent while Kafka consumers
      and OpenSearch projections are still processing.
    parameters:
      - { name: query, type: string, required: true, description: "runId, eventId, contentId, sessionId, correlationId, traceId, or idempotencyKey." }
      - { name: limit, type: integer, required: false, description: "Maximum timeline events; defaults to 250." }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/operations/timeline

  - name: admin.list_failed_operations
    mode: READ
    description: List failed async workflow steps across indexing jobs and outbox event publication.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: kind,  type: string,  required: false, description: "INDEXING_JOB | OUTBOX_EVENT." }
      - { name: limit, type: integer, required: false, description: "Default 50, max 100." }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/recovery/failures

  - name: admin.list_admin_users
    mode: READ
    description: List admin users and role/status assignments.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: status, type: string,  required: false, description: "ACTIVE | SUSPENDED." }
      - { name: role,   type: string,  required: false, description: "VIEWER | EDITOR | PUBLISHER | ADMIN." }
      - { name: limit,  type: integer, required: false }
      - { name: offset, type: integer, required: false }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/users

  # ── Analytics: privacy-safe aggregate reads ────────────────────────────
  - name: analytics.get_visitor_summary
    mode: READ
    description: Get aggregate visitor metrics for a confirmed time range. Never returns individual visitor details.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    note: |
      Privacy invariants:
        * startDate/endDate must cover at least 7 days.
        * caller must set _confirmedTimeRange=true after user approval.
        * gateway strips raw visitor identifiers and suppresses tiny buckets.
        * adapter translates startDate/endDate to a days window and calls the
          public analytics summary endpoint; no admin path is required.
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
      - { name: granularity, type: string, required: false, description: "week | month." }
      - { name: dimensions, type: array, required: false, description: "Aggregate-only breakdowns, for example country, deviceCategory." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  - name: analytics.get_top_pages
    mode: READ
    description: Get top pages by aggregate visits for a confirmed time range.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
      - { name: limit,     type: integer, required: false, description: "Default 10, max 25." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  - name: analytics.get_referrer_summary
    mode: READ
    description: Get aggregate traffic source/referrer summary for a confirmed time range.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  # ── Admin: write ────────────────────────────────────────────────────────
  - name: admin.create_content_draft
    mode: WRITE
    description: Create a new content draft (no publish, no events emitted).
    requiredRole: EDITOR
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string, required: true,  description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: title,      type: string, required: true }
      - { name: summary,    type: string, required: false }
      - { name: body,       type: string, required: false }
      - { name: category,   type: string, required: false }
      - { name: tags,       type: array,  required: false }
      - { name: imageUrl,   type: string, required: false, description: "Public cover asset URL." }
      - { name: externalUrl,type: string, required: false, description: "Optional external evidence URL." }
      - { name: year,       type: string, required: false }
      - { name: num,        type: integer,required: false, description: "Display priority; higher values appear first." }
      - { name: featured,   type: boolean,required: false }
      - { name: coverVariant, type: string, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}

  - name: admin.update_content
    mode: WRITE
    description: Update fields on an existing draft or published content item.
    requiredRole: EDITOR
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: title,      type: string,  required: false }
      - { name: summary,    type: string,  required: false }
      - { name: body,       type: string,  required: false }
      - { name: category,   type: string,  required: false }
      - { name: tags,       type: array,   required: false }
      - { name: imageUrl,   type: string,  required: false }
      - { name: externalUrl,type: string,  required: false }
      - { name: year,       type: string,  required: false }
      - { name: num,        type: integer, required: false }
      - { name: featured,   type: boolean, required: false }
      - { name: coverVariant, type: string, required: false }
      - { name: changeNote, type: string,  required: false }
    endpoint:
      target: admin
      method: PUT
      path: /api/admin/content/{sourceType}/{sourceId}

  - name: admin.upload_content_cover
    mode: WRITE
    description: Upload a validated PNG, JPEG, or WebP cover to managed storage and attach it to existing content.
    requiredRole: EDITOR
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    note: |
      Provide exactly one of sourceUrl or imageBase64. sourceUrl is accepted only
      from the admin-service configured HTTPS host allowlist. imageBase64 is bounded
      to 5 MB after decoding. The admin service validates file signatures, writes an
      immutable hash-addressed object to Supabase Storage, and then updates content.
    parameters:
      - { name: sourceType,  type: string, required: true,  minLength: 3, maxLength: 32, description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: sourceId,    type: string, required: true,  minLength: 1, maxLength: 128, description: "Content UUID or legacy numeric id." }
      - { name: sourceUrl,   type: string, required: false, maxLength: 2048, description: "Allow-listed public HTTPS image URL; mutually exclusive with imageBase64." }
      - { name: imageBase64, type: string, required: false, maxLength: 7100000, description: "Raw base64 or data:image/...;base64 payload; mutually exclusive with sourceUrl." }
      - { name: fileName,    type: string, required: false, maxLength: 255, description: "Original filename for audit context." }
      - { name: mimeType,    type: string, required: false, maxLength: 100, description: "Optional claimed MIME; verified against file signature." }
      - { name: changeNote,  type: string, required: false, maxLength: 500 }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/cover

  - name: admin.publish_content
    mode: WRITE
    description: Publish a content item and start asynchronous Search, RAG, and notification workflows. A successful response confirms publication acceptance, not downstream email delivery; verify it with notification.get_publication_delivery and admin.get_operation_timeline.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    note: |
      The gateway forwards sourceType + sourceId only. portfolio-admin-service
      assembles the Kafka payload (content.published). The gateway MUST NOT
      construct Kafka envelopes itself. After publishing, use sourceId or the
      returned eventId, correlationId, traceId, or idempotencyKey with
      notification.get_publication_delivery and admin.get_operation_timeline.
      Do not claim end-to-end success solely from this write response.
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: changeNote, type: string,  required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/publish

  - name: admin.reindex_rag
    mode: WRITE
    description: Reindex a content item into the RAG vector store.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: true
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: dryRun,     type: boolean, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/reindex-rag

  - name: admin.reindex_search
    mode: WRITE
    description: Reindex a content item into OpenSearch.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: true
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: dryRun,     type: boolean, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/reindex-search

  - name: admin.retry_indexing_job
    mode: WRITE
    description: Retry a failed indexing job by jobId.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: jobId, type: string, required: true, description: "Indexing job id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/indexing-jobs/{jobId}/retry

  - name: admin.retry_failed_operation
    mode: WRITE
    description: Retry one failed async workflow step by kind and id.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: kind, type: string, required: true, description: "INDEXING_JOB | OUTBOX_EVENT." }
      - { name: id,   type: string, required: true, description: "Failed operation id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/recovery/failures/{kind}/{id}/retry

  - name: admin.replay_outbox_event
    mode: WRITE
    description: Replay a sent, failed, or dead-lettered outbox event. Downstream consumers deduplicate by idempotency key.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: eventId, type: string, required: true, description: "Outbox event id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/outbox-events/{eventId}/replay

  - name: admin.drain_recovery_workers
    mode: WRITE
    description: Drain ready indexing and outbox workers once, useful after cold start or broker recovery.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: admin
      method: POST
      path: /api/admin/recovery/drain

  - name: admin.upsert_admin_user
    mode: WRITE
    description: Create or update an admin user's role/status assignment.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: email,       type: string, required: true }
      - { name: role,        type: string, required: true, description: "VIEWER | EDITOR | PUBLISHER | ADMIN." }
      - { name: status,      type: string, required: false, description: "ACTIVE | SUSPENDED." }
      - { name: displayName, type: string, required: false }
      - { name: note,        type: string, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/users

  - name: admin.update_admin_user_status
    mode: WRITE
    description: Activate or suspend an admin user without deleting the record.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: userId, type: string, required: true }
      - { name: status, type: string, required: true, description: "ACTIVE | SUSPENDED." }
      - { name: note,   type: string, required: false }
    endpoint:
      target: admin
      method: PATCH
      path: /api/admin/users/{userId}/status

  # ── Notification: read ──────────────────────────────────────────────────
  - name: notification.get_delivery_stats
    mode: READ
    description: Aggregated notification delivery stats.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: window,  type: string, required: false, description: "1h | 24h | 7d." }
      - { name: channel, type: string, required: false, description: "EMAIL | WEB." }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/notifications/stats

  - name: notification.get_publication_delivery
    mode: READ
    description: Verify the email delivery outcome for one published content event without exposing subscriber identity.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    note: |
      Pass sourceId, eventId, idempotencyKey, correlationId, or traceId from
      admin.publish_content. NOT_OBSERVED and PROCESSING are non-terminal and
      may be queried again because publication delivery is asynchronous.
    parameters:
      - { name: identifier, type: string, required: true, description: "sourceId, eventId, idempotencyKey, correlationId, or traceId." }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/notifications/publication-delivery

  - name: notification.list_subscribers
    mode: READ
    description: List newsletter subscribers (admin-only).
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: status,   type: string,  required: false }
      - { name: category, type: string,  required: false }
      - { name: limit,    type: integer, required: false }
      - { name: cursor,   type: string,  required: false }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/subscribers

  - name: notification.get_subscriber
    mode: READ
    description: Get a subscriber by id (admin-only).
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: subscriberId, type: string, required: true }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/subscribers/{subscriberId}

  - name: notification.list_notifications
    mode: READ
    description: List sent / scheduled notifications.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: status,  type: string,  required: false }
      - { name: channel, type: string,  required: false }
      - { name: limit,   type: integer, required: false }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/notifications

  - name: notification.list_failed_deliveries
    mode: READ
    description: List failed or pending notification deliveries.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: channel, type: string,  required: false, description: "EMAIL | WEB." }
      - { name: status,  type: string,  required: false, description: "FAILED | PENDING." }
      - { name: limit,   type: integer, required: false }
    endpoint:
      target: notification
      method: GET
      path: /api/admin/notifications/deliveries

  # ── Notification: write ─────────────────────────────────────────────────
  - name: notification.retry_failed_delivery
    mode: WRITE
    description: Retry a failed notification delivery by recipientId.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: recipientId, type: string, required: true }
    endpoint:
      target: notification
      method: POST
      path: /api/admin/notifications/deliveries/{recipientId}/retry

  - name: notification.send_test_notification
    mode: WRITE
    description: Send a test notification to a recipient.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: true
    confirmRequired: true
    parameters:
      - { name: recipient,  type: string, required: true,  description: "Email or subscriberId." }
      - { name: channel,    type: string, required: false, description: "EMAIL | WEB." }
      - { name: templateId, type: string, required: false }
    endpoint:
      target: notification
      method: POST
      path: /api/admin/notifications/test

  - name: notification.update_subscription
    mode: WRITE
    description: Update subscriber preferences.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: subscriberId, type: string, required: true }
      - { name: categories,   type: array,  required: false }
      - { name: frequency,    type: string, required: false }
    endpoint:
      target: notification
      method: PATCH
      path: /api/admin/subscribers/{subscriberId}/preferences

  - name: subscription.request_unsubscribe_code
    mode: WRITE
    description: Send a short-lived email verification code before unsubscribing an address.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    note: |
      This public, narrowly scoped tool is the first leg of the unsubscribe
      workflow. Its response never reveals whether the email is subscribed.
    parameters:
      - { name: email, type: string, required: true }
    endpoint:
      target: notification
      method: POST
      path: /api/subscriptions/unsubscribe-verification

  # ── Public contact ────────────────────────────────────────────────────
  - name: contact.email_owner
    mode: WRITE
    description: Send a visitor's one-off message to the portfolio owner.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: true
    note: |
      The caller must explicitly confirm before execution. The downstream
      endpoint sends only to the configured owner; the visitor address is
      used as reply-to and never as a recipient.
    parameters:
      - { name: email,   type: string, required: true,  description: "Visitor reply-to email." }
      - { name: message, type: string, required: true,  description: "Message body for the site owner." }
      - { name: name,    type: string, required: false, description: "Optional visitor display name." }
    endpoint:
      target: portfolio
      method: POST
      path: /api/contact

  - name: subscription.confirm_unsubscribe
    mode: WRITE
    description: Verify the emailed code and change subscription status to UNSUBSCRIBED. Never deletes subscriber data.
    requiredRole: VIEWER
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: false
    confirmationMethod: email_otp
    parameters:
      - { name: verificationId,   type: string, required: true }
      - { name: verificationCode, type: string, required: true, description: "6-digit code from the subscriber email verification flow." }
    endpoint:
      target: notification
      method: POST
      path: /api/subscriptions/unsubscribe/confirm

  # ── Alerts: read ──────────────────────────────────────────────────────
  - name: alerts.list_rules
    mode: READ
    description: List alert rules with optional filters by name, event type, or enabled status.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: name,      type: string,  required: false, description: "Name substring filter." }
      - { name: eventType, type: string,  required: false, description: "Event type filter (e.g. page_view, click)." }
      - { name: enabled,   type: boolean, required: false, description: "Filter by enabled/disabled." }
    endpoint:
      target: alerts
      method: GET
      path: /api/alert-rules

  - name: alerts.get_rule
    mode: READ
    description: Get full details of a single alert rule including version and all fields.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: ruleId, type: integer, required: true, description: "Alert rule ID." }
    endpoint:
      target: alerts
      method: GET
      path: /api/alert-rules/{ruleId}

  - name: alerts.list_incidents
    mode: READ
    description: >
      List recent visitor alert incidents and delivery state. Supports bounded filters
      by site, rule, notification state, and lookback window so an administrator can
      verify whether a rule fired and whether its notification was delivered.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: hours,    type: integer, required: false, description: "Lookback in hours; the service clamps this to 1..2160." }
      - { name: siteId,   type: string,  required: false, description: "Optional site identifier." }
      - { name: ruleId,   type: integer, required: false, description: "Optional alert rule ID." }
      - { name: notified, type: boolean, required: false, description: "Filter by notification delivery state." }
      - { name: limit,    type: integer, required: false, description: "Maximum incidents; the service clamps this to 1..200." }
    endpoint:
      target: alerts
      method: GET
      path: /api/incidents

  # ── Alerts: write (prepare/apply two-phase) ────────────────────────────
  - name: alerts.prepare_change
    mode: READ
    description: >
      Validate a proposed alert rule change and return a diff preview without modifying
      data. Returns a changeId, before/after state, diff, warnings, and expiry.
      Supported actions: CREATE, UPDATE, SET_ENABLED. CREATE requires siteId, name,
      eventType, geoLevel, granularity, threshold, comparator, and cooldownSeconds in patch.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: action,  type: string,  required: true,  description: "CREATE | UPDATE | SET_ENABLED" }
      - { name: ruleId,  type: integer, required: false, description: "Required for UPDATE and SET_ENABLED." }
      - { name: patch,   type: object,  required: true,  description: "Partial fields to change (name, threshold, granularity, enabled, etc.)." }
      - { name: reason,  type: string,  required: true, description: "Human-readable reason for the change." }
    endpoint:
      target: alerts
      method: POST
      path: /api/alert-rules/changes/prepare

  - name: alerts.apply_change
    mode: WRITE
    description: >
      Apply a previously prepared change. Only accepts the changeId returned by
      alerts.prepare_change. The change must not be expired and is single-use.
      Requires an idempotency key to prevent double-execution.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: changeId,       type: string, required: true,  description: "Change token from prepare_change." }
      - { name: idempotencyKey, type: string, required: true, description: "Unique key to prevent duplicate applies; injected by the agent runtime." }
    endpoint:
      target: alerts
      method: POST
      path: /api/alert-rules/changes/apply
