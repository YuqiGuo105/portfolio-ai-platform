# Sprint 1 MCP tool catalog.
#
# IMPORTANT: tool names here MUST match site.yuqi.agent.intent.ToolRegistry
# in portfolio-agent-service exactly. The agent calls
#   POST /api/tools/{name}/invoke
# and {name} comes from its own allowlist.
#
# Each entry declares:
#   name              – stable string; agent.intent.ToolDefinition.name
#   mode              – READ | WRITE   (gateway uses this for audit + idempotency)
#   description       – short human-readable summary
#   requiredRole      – VIEWER | EDITOR | PUBLISHER | ADMIN
#   riskLevel         – LOW | MEDIUM | HIGH | CRITICAL  (gateway taxonomy)
#   dryRunSupported   – boolean
#   confirmRequired   – boolean (writes must pass _confirmed=true)
#   confirmationMethod– optional, e.g. "email_otp"
#   parameters        – list of { name, type, required, description }
#   endpoint          – { target, method, path }
#                       target ∈ portfolio | admin | notification
#
# Hard invariants enforced by the gateway:
#   * NEVER writes Supabase tables directly.
#   * NEVER constructs Kafka payloads — admin-service owns event emission for
#     publish / reindex / retry tools.
#   * Every WRITE-mode tool is audited via AuditService and respects the
#     riskLevel / confirmRequired flags.

tools:
  - name: portfolio.get_public_profile
    mode: READ
    description: Read explicitly approved public profile evidence. No private CV or application memory is accessed.
    requiredRole: VIEWER
    riskLevel: LOW
    confirmRequired: false
    parameters: []
    endpoint: { target: knowledge, method: GET, path: /internal/v1/knowledge/public/profile }

  - name: portfolio.search_public_knowledge
    mode: READ
    description: Semantically search published public-answer content and owner-approved personal snippets across languages. Restricted source identifiers and URLs are withheld.
    requiredRole: VIEWER
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: query, type: string, required: true, minLength: 1, maxLength: 300 }
      - { name: limit, type: integer, required: false }
    endpoint: { target: knowledge, method: POST, path: /internal/v1/knowledge/public/search }

  - name: knowledge.list
    mode: READ
    description: Search the private knowledge base by text and inspect canonical owner notes or generated RAG chunks. Administrator login required. Defaults to owner-managed records; indexed chunks are read-only.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: filter, type: object, required: false, description: "{query?: string (max 300), scope?: OWNED|INDEXED|ALL, status?: ALL|DRAFT|ACTIVE|ARCHIVED|SUPERSEDED|LEGACY}. Defaults to OWNED/ALL." }
      - { name: page, type: object, required: false, description: "{size?: integer 1-100 (default 25), offset?: integer 0-100000 (default 0)}." }
    endpoint: { target: admin, method: POST, path: /api/admin/knowledge/search }

  - name: knowledge.batch_get
    mode: READ
    description: Read 1-25 private knowledge records in one bounded batch. Returns per-ID found flags and records with indexing state; missing IDs do not hide successful reads. Administrator login required.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: ids, type: array, required: true, description: "1-25 UUID strings from knowledge.list. Duplicates are read once." }
    endpoint: { target: admin, method: POST, path: /api/admin/knowledge/batch-get }

  - name: knowledge.get
    mode: READ
    description: Read a private knowledge record, its revision, provenance and indexing job status. Use the returned revision as expectedRevision for changes. Never expose private answers to public callers.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: id, type: string, required: true, minLength: 36, maxLength: 36, description: "Knowledge record UUID." }
    endpoint: { target: admin, method: GET, path: "/api/admin/knowledge/{id}" }

  - name: knowledge.create
    mode: WRITE
    description: Create an owner-managed knowledge record. Defaults to a private DRAFT. ACTIVE plus public explicitly approves public answers and queues Gemini embedding; source text stays admin-only. Confirm the exact content and visibility first. Poll knowledge.get for indexing completion; saving is not indexing success.
    requiredRole: ADMIN
    riskLevel: HIGH
    confirmRequired: true
    parameters:
      - { name: document, type: object, required: true, description: "{title: string (1-240), question?: string (max 1000), content: string (1-20000)}." }
      - { name: policy, type: object, required: false, description: "{status?: DRAFT|ACTIVE|ARCHIVED, answerVisibility?: private|public}. Defaults DRAFT/private. ACTIVE requires public." }
    endpoint: { target: admin, method: POST, path: /api/admin/knowledge }

  - name: knowledge.update
    mode: WRITE
    description: Replace an owner-managed knowledge record after reading knowledge.get. Requires its exact expectedRevision; rejects concurrent edits. Invalidates old answer chunks and queues a new RAG job if ACTIVE/public. Gemini receives approved text for embedding. Generated chunks must be edited at their source instead. Confirm content and visibility before executing.
    requiredRole: ADMIN
    riskLevel: HIGH
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true, minLength: 36, maxLength: 36 }
      - { name: preconditions, type: object, required: true, description: "{revision: string}, exactly the 32-character revision returned by knowledge.get." }
      - { name: document, type: object, required: true, description: "{title: string (1-240), question?: string (max 1000), content: string (1-20000)}. Full replacement, not a patch." }
      - { name: policy, type: object, required: true, description: "{status: DRAFT|ACTIVE|ARCHIVED, answerVisibility: private|public}. ACTIVE requires public." }
    endpoint: { target: admin, method: PUT, path: "/api/admin/knowledge/{id}" }

  - name: knowledge.delete
    mode: WRITE
    description: Delete an owner-managed knowledge record and its derived answer chunks. An audit snapshot is retained. Requires explicit user confirmation and expectedRevision from knowledge.get. In-flight stale indexing cannot recreate deleted knowledge.
    requiredRole: ADMIN
    riskLevel: HIGH
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true, minLength: 36, maxLength: 36 }
      - { name: expectedRevision, type: string, required: true, minLength: 32, maxLength: 32 }
    endpoint: { target: admin, method: DELETE, path: "/api/admin/knowledge/{id}" }

  - name: operation.get_status
    mode: READ
    description: Get durable status for your MCP write operation. UNKNOWN means verify downstream effects before any retry. SUCCEEDED confirms the tool call, not asynchronous delivery.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: id, type: string, required: true, description: "operationId from a write response." }
    endpoint: { target: admin, method: GET, path: "/api/admin/mcp-operations/{id}" }

  - name: operation.list
    mode: READ
    description: List your recent durable MCP write operations including success, failure, pending and uncertain outcomes.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: limit, type: integer, required: false, description: "Maximum 100 records; defaults to 20." }
    endpoint: { target: admin, method: GET, path: /api/admin/mcp-operations }

  - name: operation.get_timeline
    mode: READ
    description: Read database-backed state transitions and retry attempts for your MCP operation. Retry only when safeToRetry is true, using the original tool, key and unchanged payload.
    requiredRole: ADMIN
    riskLevel: LOW
    confirmRequired: false
    parameters:
      - { name: id, type: string, required: true, description: "operationId from a write response." }
    endpoint: { target: admin, method: GET, path: "/api/admin/mcp-operations/{id}/timeline" }

  # ── Career application copilot (owner-only admin MCP) ─────────────────
  - name: career.get_candidate_profile
    mode: READ
    description: Get the current candidate profile snapshot assembled from first-party portfolio content through the MCP cluster.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/candidate-profile

  - name: career.refresh_candidate_profile
    mode: WRITE
    description: Refresh the Valkey candidate profile snapshot from current portfolio experience and project content.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters: []
    endpoint:
      target: career
      method: POST
      path: /internal/v1/candidate-profile/refresh

  - name: career.resolve_application_fields
    mode: READ
    description: Resolve job application fields from the cached MCP profile and private application memory; sensitive answers are returned for review, never guessed.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true }
      - { name: fields, type: array, required: true, description: "Detected form fields with id, label, type, and optional choices." }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/application-fields/resolve

  - name: career.classify_application_fields
    mode: READ
    description: Normalize every detected application question with the low-cost Gemini fallback when local Codex is unavailable; no candidate answers are sent to the model.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true }
      - { name: fields, type: array, required: true, description: "Detected form questions with id, visible label, control type, and choices; never candidate answers." }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/application-fields/classify

  - name: career.update_private_answers
    mode: WRITE
    description: Update encrypted owner-only answers used for recurring job application questions.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: answers, type: object, required: true, description: "Normalized question-to-answer updates; null removes an answer." }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/candidate-profile/private-answers

  - name: career.start_application_workflow
    mode: WRITE
    description: Start an idempotent and auditable application workflow after scanning an ATS page.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: ats, type: string, required: true, maxLength: 64 }
      - { name: origin, type: string, required: true, maxLength: 512 }
      - { name: pageUrl, type: string, required: true, maxLength: 2000 }
      - { name: jobTitle, type: string, required: false, maxLength: 500 }
      - { name: detectedFields, type: integer, required: true }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/application-workflows

  - name: career.get_application_workflow
    mode: READ
    description: Read one application state machine and its immutable transition timeline.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
    endpoint:
      target: career
      method: GET
      path: /internal/v1/application-workflows/{applicationId}

  - name: career.record_application_resolution
    mode: WRITE
    description: Record deterministic, review-required, and unsupported field counts.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: resolved, type: integer, required: true }
      - { name: requiresReview, type: integer, required: true }
      - { name: unsupported, type: integer, required: true }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/application-workflows/{applicationId}/resolution

  - name: career.record_application_review
    mode: WRITE
    description: Record owner-approved fields before values are written to an ATS page.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: approvedFields, type: integer, required: true }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/application-workflows/{applicationId}/review

  - name: career.record_application_fill
    mode: WRITE
    description: Record values written to the current ATS page; this tool never submits the form.
    requiredRole: ADMIN
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: appliedFields, type: integer, required: true }
      - { name: resumeAttached, type: boolean, required: true }
      - { name: detectedAction, type: string, required: false, maxLength: 80 }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/application-workflows/{applicationId}/fill

  - name: career.record_submission_receipt
    mode: WRITE
    description: Record an ATS success-page receipt after manual submit without claiming email confirmation.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: successUrl, type: string, required: true, maxLength: 2000 }
      - { name: externalApplicationId, type: string, required: false, maxLength: 255 }
      - { name: confirmationText, type: string, required: false, maxLength: 1000 }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/application-workflows/{applicationId}/submission

  - name: career.confirm_application_submission
    mode: WRITE
    description: Attach an independently observed provider confirmation to a submitted workflow.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: applicationId, type: string, required: true, maxLength: 64 }
      - { name: channel, type: string, required: true, maxLength: 80 }
      - { name: externalMessageId, type: string, required: false, maxLength: 255 }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/application-workflows/{applicationId}/confirmation

  - name: career.get_site_credential
    mode: READ
    description: Load the encrypted owner-only account credential for one HTTPS application origin.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: origin, type: string, required: true, description: "Exact HTTPS origin of the current ATS sign-in page." }
    endpoint:
      target: career
      method: GET
      path: /internal/v1/site-credentials

  - name: career.prepare_site_credential
    mode: WRITE
    description: Create or reuse a unique encrypted credential for one ATS origin before an owner-reviewed sign-up.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: origin, type: string, required: true, description: "Exact HTTPS origin of the current ATS sign-up page." }
      - { name: username, type: string, required: true, description: "Owner-reviewed account email or username." }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/site-credentials/prepare

  - name: career.list_private_resumes
    mode: READ
    description: List owner-only application resume records from the encrypted private vault.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/private-resumes

  - name: career.get_private_resume
    mode: READ
    description: Read one owner-only application resume, including its encrypted-at-rest content.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true }
    endpoint:
      target: career
      method: GET
      path: /internal/v1/private-resumes/{id}

  - name: career.create_private_resume
    mode: WRITE
    description: Create an encrypted application resume in the dedicated career database.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: label, type: string, required: true, maxLength: 160 }
      - { name: content, type: string, required: true, maxLength: 1500000 }
      - { name: fileName, type: string, required: false, maxLength: 255 }
      - { name: mimeType, type: string, required: false, maxLength: 120 }
      - { name: sourceUrl, type: string, required: false, maxLength: 2000 }
      - { name: active, type: boolean, required: false }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/private-resumes

  - name: career.update_private_resume
    mode: WRITE
    description: Replace one encrypted private application resume using optimistic locking.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true }
      - { name: label, type: string, required: true, maxLength: 160 }
      - { name: content, type: string, required: true, maxLength: 1500000 }
      - { name: fileName, type: string, required: false, maxLength: 255 }
      - { name: mimeType, type: string, required: false, maxLength: 120 }
      - { name: sourceUrl, type: string, required: false, maxLength: 2000 }
      - { name: active, type: boolean, required: false }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/private-resumes/{id}

  - name: career.delete_private_resume
    mode: WRITE
    description: Soft-delete one private application resume while retaining its audit trail.
    requiredRole: ADMIN
    riskLevel: CRITICAL
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true }
    endpoint:
      target: career
      method: DELETE
      path: /internal/v1/private-resumes/{id}

  - name: career.get_private_answers
    mode: READ
    description: Read encrypted owner-only answers for recurring application questions such as work authorization and I-140 status.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/private-answers

  - name: career.upsert_private_answer
    mode: WRITE
    description: Create or update one encrypted owner-only application answer.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: key, type: string, required: true, maxLength: 240 }
      - { name: value, type: string, required: true, maxLength: 2000 }
    endpoint:
      target: career
      method: PUT
      path: /internal/v1/private-answers/{key}

  - name: career.delete_private_answer
    mode: WRITE
    description: Delete one private application answer by normalized key.
    requiredRole: ADMIN
    riskLevel: CRITICAL
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: key, type: string, required: true, maxLength: 240 }
    endpoint:
      target: career
      method: DELETE
      path: /internal/v1/private-answers/{key}

  - name: career.list_resume_assets
    mode: READ
    description: List metadata for owner-only PDF resume versions stored in the private Resume Asset Vault.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/resume-assets

  - name: career.get_active_resume_asset
    mode: READ
    description: Get metadata and integrity information for the active application resume without returning file content.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: false
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/resume-assets/active

  - name: career.prepare_resume_upload
    mode: WRITE
    description: Prepare a private, time-limited Supabase Storage upload for a new PDF resume version.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: fileName, type: string, required: true, maxLength: 255 }
      - { name: mimeType, type: string, required: true, maxLength: 120 }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/resume-assets/uploads

  - name: career.complete_resume_upload
    mode: WRITE
    description: Validate an uploaded PDF by magic bytes, size and SHA-256, then atomically make it the active application resume.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true, maxLength: 64 }
      - { name: sha256, type: string, required: false, minLength: 64, maxLength: 64 }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/resume-assets/{id}/complete

  - name: career.activate_resume_asset
    mode: WRITE
    description: Roll back the application resume pointer to a previously validated PDF version.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true, maxLength: 64 }
    endpoint:
      target: career
      method: POST
      path: /internal/v1/resume-assets/{id}/activate

  - name: career.get_active_resume_download
    mode: READ
    description: Issue a short-lived signed download ticket for the active PDF after explicit owner approval.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: career
      method: GET
      path: /internal/v1/resume-assets/active/download

  # ── Owner-only public Resume Domain ────────────────────────────────────
  - name: resume.get_current
    mode: READ
    description: Read the currently published public CV and its public metadata.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: admin
      method: GET
      path: /api/admin/resume

  - name: resume.list_versions
    mode: READ
    description: List public CV draft, published, superseded and archived revisions.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: limit, type: integer, required: false }
    endpoint:
      target: admin
      method: GET
      path: /api/admin/resume/revisions

  - name: resume.get_version
    mode: READ
    description: Read one owner-only public CV revision, including unpublished content.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: id, type: string, required: true }
    endpoint:
