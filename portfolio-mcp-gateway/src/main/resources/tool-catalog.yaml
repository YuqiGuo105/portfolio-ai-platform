  # ── Analytics: privacy-safe aggregate reads ────────────────────────────
  - name: analytics.get_visitor_summary
    mode: READ
    description: Get aggregate visitor metrics for a confirmed time range. Never returns individual visitor details.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    note: |
      Privacy invariants:
        * startDate/endDate must cover at least 7 days.
        * caller must set _confirmedTimeRange=true after user approval.
        * gateway strips raw visitor identifiers and suppresses tiny buckets.
        * adapter translates startDate/endDate to a days window and calls the
          public analytics summary endpoint; no admin path is required.
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
      - { name: granularity, type: string, required: false, description: "week | month." }
      - { name: dimensions, type: array, required: false, description: "Aggregate-only breakdowns, for example country, deviceCategory." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  - name: analytics.get_top_pages
    mode: READ
    description: Get top pages by aggregate visits for a confirmed time range.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
      - { name: limit,     type: integer, required: false, description: "Default 10, max 25." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  - name: analytics.get_referrer_summary
    mode: READ
    description: Get aggregate traffic source/referrer summary for a confirmed time range.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: false
    parameters:
      - { name: startDate, type: string, required: true, description: "ISO date, inclusive." }
      - { name: endDate,   type: string, required: true, description: "ISO date, inclusive. Minimum range is 7 days." }
    endpoint:
      target: analytics
      method: GET
      path: /api/public/visits/summary

  # Private event records: authenticated ADMIN only; public analytics stays aggregate-only.
  - name: visitor.search_events
    mode: READ
    description: Search individual visitor event records as an authenticated administrator. Returns timestamps, pages, location, user-agent, IP/session identifiers, properties and pagination. The admin MCP edge adds automationEvidence and bounded trafficAnalysis with detector version, stored-flag conflicts and sample completeness. Use this to investigate human versus automated visits. bot=false, scrolling and engaged time do NOT prove a human; user-agent does not verify operator identity. Never disclose these private records publicly.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    confirmRequired: false
    parameters:
      - { name: filter, type: object, required: false, description: 'Optional fields: q (text search, max 200 chars), event, path (contains), country, city, device, browser, referrer (contains), sessionId (exact), includeAdmin (boolean, default false). Other text filters match exactly. No arbitrary fields.' }
      - { name: window, type: object, required: false, description: 'Use {"hours":24} (1-744), or {"from":"ISO timestamp with timezone","to":"ISO timestamp with timezone"} (at most 31 days, from inclusive, to exclusive). Default last 24 hours. Reuse response from/to when paging.' }
      - { name: page, type: object, required: false, description: '{"number":0,"size":25}; number 0-10000, size 1-100. Read one bounded page per call; do not automatically export all records.' }
    endpoint:
      target: visitor-admin
      method: GET
      path: /api/admin/visitors

  - name: visitor.get_session_events
    mode: READ
    description: Read a known visitor session's events as an authenticated administrator. Returns private details newest first and admin-edge automation evidence; excludes admin traffic. Use the exact sessionId and fixed time window from visitor.search_events to investigate request timing and behavior. bot=false or engagement does NOT verify a human. Empty results mean no matches in this window, not no historical visits. Never disclose these records publicly.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    confirmRequired: false
    parameters:
      - { name: sessionId, type: string, required: true, minLength: 1, maxLength: 256, description: 'Exact session identifier, not an IP address or an abbreviated display value.' }
      - { name: window, type: object, required: false, description: 'Use {"hours":24} (1-744), or {"from":"ISO timestamp with timezone","to":"ISO timestamp with timezone"} (at most 31 days, from inclusive, to exclusive). Default last 24 hours. Reuse response from/to when paging.' }
      - { name: page, type: object, required: false, description: '{"number":0,"size":25}; number 0-10000, size 1-100. Read one bounded page per call.' }
    endpoint:
      target: visitor-admin
      method: GET
      path: /api/admin/visitors

  # ── Admin: write ────────────────────────────────────────────────────────
  - name: admin.create_content_draft
    mode: WRITE
    description: Create a new content draft (no publish, no events emitted).
    requiredRole: EDITOR
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string, required: true,  description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: title,      type: string, required: true }
      - { name: summary,    type: string, required: false }
      - { name: body,       type: string, required: false }
      - { name: category,   type: string, required: false }
      - { name: tags,       type: array,  required: false }
      - { name: imageUrl,   type: string, required: false, description: "Public cover asset URL." }
      - { name: externalUrl,type: string, required: false, description: "Optional external evidence URL." }
      - { name: year,       type: string, required: false }
      - { name: num,        type: integer,required: false, description: "Display priority; higher values appear first." }
      - { name: featured,   type: boolean,required: false }
      - { name: coverVariant, type: string, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}

  - name: admin.update_content
    mode: WRITE
    description: Update fields on an existing draft or published content item.
    requiredRole: EDITOR
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: title,      type: string,  required: false }
      - { name: summary,    type: string,  required: false }
      - { name: body,       type: string,  required: false }
      - { name: category,   type: string,  required: false }
      - { name: tags,       type: array,   required: false }
      - { name: imageUrl,   type: string,  required: false }
      - { name: externalUrl,type: string,  required: false }
      - { name: year,       type: string,  required: false }
      - { name: num,        type: integer, required: false }
      - { name: featured,   type: boolean, required: false }
      - { name: coverVariant, type: string, required: false }
      - { name: changeNote, type: string,  required: false }
    endpoint:
      target: admin
      method: PUT
      path: /api/admin/content/{sourceType}/{sourceId}

  - name: admin.upload_content_cover
    mode: WRITE
    description: Upload a validated PNG, JPEG, or WebP cover to managed storage and attach it to existing content.
    requiredRole: EDITOR
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    note: |
      Provide exactly one of sourceUrl or imageBase64. sourceUrl is accepted only
      from the admin-service configured HTTPS host allowlist. imageBase64 is bounded
      to 5 MB after decoding. The admin service validates file signatures, writes an
      immutable hash-addressed object to Supabase Storage, and then updates content.
    parameters:
      - { name: sourceType,  type: string, required: true,  minLength: 3, maxLength: 32, description: "BLOG | PROJECT | LIFE | EXPERIENCE." }
      - { name: sourceId,    type: string, required: true,  minLength: 1, maxLength: 128, description: "Content UUID or legacy numeric id." }
      - { name: sourceUrl,   type: string, required: false, maxLength: 2048, description: "Allow-listed public HTTPS image URL; mutually exclusive with imageBase64." }
      - { name: imageBase64, type: string, required: false, maxLength: 7100000, description: "Raw base64 or data:image/...;base64 payload; mutually exclusive with sourceUrl." }
      - { name: fileName,    type: string, required: false, maxLength: 255, description: "Original filename for audit context." }
      - { name: mimeType,    type: string, required: false, maxLength: 100, description: "Optional claimed MIME; verified against file signature." }
      - { name: changeNote,  type: string, required: false, maxLength: 500 }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/cover

  - name: admin.publish_content
    mode: WRITE
    description: Publish a content item and start asynchronous Search, RAG, and notification workflows. A successful response confirms publication acceptance, not downstream email delivery; verify it with notification.get_publication_delivery and admin.get_operation_timeline.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    note: |
      The gateway forwards sourceType + sourceId only. portfolio-admin-service
      assembles the Kafka payload (content.published). The gateway MUST NOT
      construct Kafka envelopes itself. After publishing, use sourceId or the
      returned eventId, correlationId, traceId, or idempotencyKey with
      notification.get_publication_delivery and admin.get_operation_timeline.
      Do not claim end-to-end success solely from this write response.
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: changeNote, type: string,  required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/publish

  - name: admin.reindex_rag
    mode: WRITE
    description: Reindex a content item into the RAG vector store.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: true
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: dryRun,     type: boolean, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/reindex-rag

  - name: admin.reindex_search
    mode: WRITE
    description: Reindex a content item into OpenSearch.
    requiredRole: PUBLISHER
    riskLevel: HIGH
    dryRunSupported: true
    confirmRequired: true
    parameters:
      - { name: sourceType, type: string,  required: true }
      - { name: sourceId,   type: string,  required: true, description: "Content UUID or legacy numeric id." }
      - { name: dryRun,     type: boolean, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/content/{sourceType}/{sourceId}/reindex-search

  - name: admin.retry_indexing_job
    mode: WRITE
    description: Retry a failed indexing job by jobId.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: jobId, type: string, required: true, description: "Indexing job id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/indexing-jobs/{jobId}/retry

  - name: admin.retry_failed_operation
    mode: WRITE
    description: Retry one failed async workflow step by kind and id.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: kind, type: string, required: true, description: "INDEXING_JOB | OUTBOX_EVENT." }
      - { name: id,   type: string, required: true, description: "Failed operation id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/recovery/failures/{kind}/{id}/retry

  - name: admin.replay_outbox_event
    mode: WRITE
    description: Replay a sent, failed, or dead-lettered outbox event. Downstream consumers deduplicate by idempotency key.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: eventId, type: string, required: true, description: "Outbox event id." }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/outbox-events/{eventId}/replay

  - name: admin.drain_recovery_workers
    mode: WRITE
    description: Drain ready indexing and outbox workers once, useful after cold start or broker recovery.
    requiredRole: ADMIN
    riskLevel: MEDIUM
    dryRunSupported: false
    confirmRequired: true
    parameters: []
    endpoint:
      target: admin
      method: POST
      path: /api/admin/recovery/drain

  - name: admin.upsert_admin_user
    mode: WRITE
    description: Create or update an admin user's role/status assignment.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: email,       type: string, required: true }
      - { name: role,        type: string, required: true, description: "VIEWER | EDITOR | PUBLISHER | ADMIN." }
      - { name: status,      type: string, required: false, description: "ACTIVE | SUSPENDED." }
      - { name: displayName, type: string, required: false }
      - { name: note,        type: string, required: false }
    endpoint:
      target: admin
      method: POST
      path: /api/admin/users

  - name: admin.update_admin_user_status
    mode: WRITE
    description: Activate or suspend an admin user without deleting the record.
    requiredRole: ADMIN
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: true
    parameters:
      - { name: userId, type: string, required: true }
      - { name: status, type: string, required: true, description: "ACTIVE | SUSPENDED." }
      - { name: note,   type: string, required: false }
    endpoint:
      target: admin
      method: PATCH
      path: /api/admin/users/{userId}/status

  # ── Notification: read ──────────────────────────────────────────────────
