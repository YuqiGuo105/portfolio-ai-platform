  # ── Public contact ────────────────────────────────────────────────────
  - name: contact.email_owner
    mode: WRITE
    description: Send a visitor's one-off message to the portfolio owner.
    requiredRole: VIEWER
    riskLevel: LOW
    dryRunSupported: false
    confirmRequired: true
    note: |
      The caller must explicitly confirm before execution. The downstream
      endpoint sends only to the configured owner; the visitor address is
      used as reply-to and never as a recipient.
    parameters:
      - { name: email,   type: string, required: true,  description: "Visitor reply-to email." }
      - { name: message, type: string, required: true,  description: "Message body for the site owner." }
      - { name: name,    type: string, required: false, description: "Optional visitor display name." }
    endpoint:
      target: portfolio
      method: POST
      path: /api/contact

  - name: subscription.confirm_unsubscribe
    mode: WRITE
    description: Verify the emailed code and change subscription status to UNSUBSCRIBED. Never deletes subscriber data.
    requiredRole: VIEWER
    riskLevel: HIGH
    dryRunSupported: false
    confirmRequired: false
    confirmationMethod: email_otp
    parameters:
      - { name: verificationId,   type: string, required: true }
      - { name: verificationCode, type: string, required: true, description: "6-digit code from the subscriber email verification flow." }
    endpoint:
      target: notification
      method: POST
      path: /api/subscriptions/unsubscribe/confirm

